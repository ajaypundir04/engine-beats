spring:
  datasource:
    url: jdbc:h2:mem:enginebeats_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.enginebeats.mock/realms/engine-beats
          jwk-set-uri: https://auth.enginebeats.mock/jwks

logging:
  level:
    com.enginebeats: DEBUG
