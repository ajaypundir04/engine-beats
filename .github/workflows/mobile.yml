name: Mobile & OBD Packages CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - 'packages/obd-core/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - 'packages/obd-core/**'
      - '.github/workflows/mobile.yml'

jobs:
  test-obd-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Test obd-core package
        working-directory: packages/obd-core
        run: |
          dart pub get
          dart test

  test-mobile-app:
    runs-on: ubuntu-latest
    needs: test-obd-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Flutter Analyze & Test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test
