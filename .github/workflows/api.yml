name: API CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: services/api
        run: mvn clean test

      - name: Build Docker Image
        working-directory: services/api
        run: docker build -t enginebeats-api:latest .
